<!DOCTYPE html>

<html>

<head>

    <title>PDF RAG Chatbot</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        #chat {
            border: 1px solid #ddd;
            padding: 20px;
            min-height: 400px;
            margin-bottom: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .user {
            font-weight: bold;
        }

        .assistant {
            margin-top: 5px;
        }

        .error {
            color: red;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            margin-top: 10px;
            color: #666;
        }

    </style>

</head>


<body>


<h1>PDF RAG Chatbot</h1>


<div id="chat"></div>


<div class="input-container">

    <input
        id="question"
        type="text"
        placeholder="Ask something about the PDF..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

</div>


<div id="status"></div>


<script>


async function sendMessage() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();


    if (!question) {
        return;
    }


    // Show user's question

    addMessage(
        "You",
        question,
        "user"
    );


    // Clear input

    input.value = "";


    // Show status

    document.getElementById("status")
        .textContent = "Searching PDF...";


    try {


        const response = await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            }
        );


        const data = await response.json();


        // --------------------------------------
        // Backend returned an error
        // --------------------------------------

        if (!response.ok) {

            addMessage(
                "Error",
                data.error || "Something went wrong.",
                "error"
            );

            return;
        }


        // --------------------------------------
        // Display Gemini answer
        // --------------------------------------

        addMessage(
            "Assistant",
            data.answer,
            "assistant"
        );


        // --------------------------------------
        // Show sources
        // --------------------------------------

        if (data.sources && data.sources.length > 0) {

            const pages = data.sources
                .map(source => `Page ${source.page}`)
                .join(", ");


            addMessage(
                "Sources",
                pages,
                "assistant"
            );
        }


    }

    catch (error) {

        addMessage(
            "Error",
            error.message,
            "error"
        );

    }

    finally {

        document.getElementById("status")
            .textContent = "";

    }

}


function addMessage(
    sender,
    message,
    className
) {

    const chat =
        document.getElementById("chat");


    const div =
        document.createElement("div");


    div.className =
        `message ${className}`;


    const senderElement =
        document.createElement("strong");


    senderElement.textContent =
        sender + ":";


    const messageElement =
        document.createElement("div");


    messageElement.textContent =
        message;


    div.appendChild(senderElement);

    div.appendChild(messageElement);


    chat.appendChild(div);


    // Automatically scroll down

    chat.scrollTop =
        chat.scrollHeight;
}


</script>


</body>

</html>
